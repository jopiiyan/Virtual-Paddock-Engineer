server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container ("backend" = compose service name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Needed for streaming chat (SSE): send tokens immediately, don't buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # LLM / telemetry calls can be slow
    }

    # Everything else: the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}