server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend.
    # ${BACKEND_URL} is filled in when the container starts (nginx image "templates" feature):
    #   - docker-compose: http://backend:8000   (Dockerfile default; "backend" = compose service name)
    #   - Azure:          http://paddock-api    (the backend Container App's name; needs a
    #                     ConsumptionOnly environment — "Express" environments can't do this)
    # No "Host" override on purpose: nginx then sends the backend's own name as Host,
    # which Azure Container Apps needs to route the request to the right app.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # When BACKEND_URL is https (Azure), send the backend's hostname in the TLS handshake (SNI)
        # so Azure can route to the right app. Harmless for plain http (docker-compose).
        proxy_ssl_server_name on;
        # Needed for streaming chat (SSE): send tokens immediately, don't buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # LLM / telemetry calls can be slow
    }

    # Everything else: the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}